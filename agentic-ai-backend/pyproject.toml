[project]
name = "agentic-ai-backend"
version = "0.1.0"
description = "Production-style agentic AI backend service with FastAPI, LangChain, PostgreSQL, Redis, and Docker."
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "langchain>=0.2.17",
    "langchain-anthropic>=0.1.23",
    "langchain-core>=0.2.43",
    "prometheus-client>=0.20.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-json-logger>=2.0.7",
    "redis>=5.0.8",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
